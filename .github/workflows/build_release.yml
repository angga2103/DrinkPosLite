name: Build & Release DrinkPOS Lite APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Judul Rilis (opsional, contoh: v1.0.1 - Perbaikan Printer & Layout)'
        required: false
        default: 'Pembaruan DrinkPOS Lite'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Comprehensive Tests
        run: flutter test

      - name: Build Release APK (arm64-v8a)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk DrinkPOS-Lite-arm64-v8a.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrinkPOS-Lite-arm64-v8a
          path: DrinkPOS-Lite-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          tag_name: ${{ github.ref_name || format('v{0}', github.run_number) }}
          files: DrinkPOS-Lite-arm64-v8a.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
